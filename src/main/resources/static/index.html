<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>欲しいものリスト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>欲しいものリスト</h1>

    <!-- 登録フォーム -->
    <div class="card">
        <h2>新しいアイテムを追加</h2>
        <form id="add-form">
            <div class="form-group">
                <label>名前:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>価格:</label>
                <input type="number" id="price">
            </div>
            <div class="form-group">
                <label>URL:</label>
                <input type="text" id="url">
            </div>
            <div class="form-group">
                <label>メモ:</label>
                <input type="text" id="memo">
            </div>
            <button type="submit" class="btn btn-primary">登録する</button>
        </form>
    </div>

    <!-- 編集フォーム -->
    <div id="edit-section" class="card" style="display:none; background:#fffbe6;">
        <h2>アイテムを編集</h2>
        <form id="edit-form">
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <label>名前:</label>
                <input type="text" id="edit-name" required>
            </div>
            <div class="form-group">
                <label>価格:</label>
                <input type="number" id="edit-price">
            </div>
            <div class="form-group">
                <label>URL:</label>
                <input type="text" id="edit-url">
            </div>
            <div class="form-group">
                <label>メモ:</label>
                <input type="text" id="edit-memo">
            </div>
            <button type="submit" class="btn btn-primary">更新する</button>
            <button type="button" onclick="cancelEdit()" class="btn btn-secondary">キャンセル</button>
        </form>
    </div>

    <!-- 一覧表示 -->
    <div class="card">
        <h2>欲しいもの一覧</h2>
        <button onclick="fetchItems()" class="btn btn-secondary">リストを更新</button>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>名前</th>
                <th>価格</th>
                <th>URL</th>
                <th>メモ</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="item-list">
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = '/api/notes';

    window.onload = () => {
        fetchItems();
    };

    // 1. 全件取得
    async function fetchItems() {
        try {
            const response = await fetch(API_URL);
            const items = await response.json();
            const tbody = document.getElementById('item-list');
            tbody.innerHTML = '';

            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${item.price || ''}</td>
                        <td><a href="${item.url || '#'}" target="_blank">${item.url || ''}</a></td>
                        <td>${item.memo || ''}</td>
                        <td>
                            <button onclick="editItem(${item.id}, '${item.name}', ${item.price || 0}, '${item.url || ''}', '${item.memo || ''}')" class="btn btn-sm btn-primary">編集</button>
                            <button onclick="deleteItem(${item.id})" class="btn btn-sm btn-danger">削除</button>
                        </td>
                    `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('取得エラー:', error);
        }
    }

    // 2. 登録
    document.getElementById('add-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newItem = {
            name: document.getElementById('name').value,
            price: document.getElementById('price').value ? Number(document.getElementById('price').value) : null,
            url: document.getElementById('url').value,
            memo: document.getElementById('memo').value
        };

        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newItem)
        });

        document.getElementById('add-form').reset();
        fetchItems();
    });

    function editItem(id, name, price, url, memo) {
        document.getElementById('edit-section').style.display = 'block';
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-name').value = name;
        document.getElementById('edit-price').value = price || '';
        document.getElementById('edit-url').value = url === 'null' ? '' : url;
        document.getElementById('edit-memo').value = memo === 'null' ? '' : memo;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        document.getElementById('edit-section').style.display = 'none';
        document.getElementById('edit-form').reset();
    }

    // 4. 更新
    document.getElementById('edit-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('edit-id').value;
        const updatedItem = {
            name: document.getElementById('edit-name').value,
            price: document.getElementById('edit-price').value ? Number(document.getElementById('edit-price').value) : null,
            url: document.getElementById('edit-url').value,
            memo: document.getElementById('edit-memo').value
        };

        await fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedItem)
        });

        cancelEdit();
        fetchItems();
    });

    // 5. 削除
    async function deleteItem(id) {
        if (!confirm('本当に削除しますか？')) return;
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        fetchItems();
    }
</script>
</body>
</html>
