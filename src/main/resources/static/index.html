<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>欲しいものリスト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>欲しいものリスト</h1>

<!-- 登録フォーム -->
<fieldset>
    <legend>新しいアイテムの登録</legend>
    <form id="add-form">
        <p>
            <label>名前: <input type="text" id="name" required></label>
        </p>
        <p>
            <label>価格: <input type="number" id="price"></label>
        </p>
        <p>
            <label>URL: <input type="text" id="url"></label>
        </p>
        <p>
            <label>メモ: <input type="text" id="memo"></label>
        </p>
        <button type="submit">登録</button>
    </form>
</fieldset>

<br>

<!-- 一覧表示 -->
<fieldset>
    <legend>登録一覧</legend>
    <button onclick="fetchItems()">更新</button>
    <table border="1">
        <thead>
        <tr>
            <th>ID</th>
            <th>名前</th>
            <th>価格</th>
            <th>URL</th>
            <th>メモ</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="item-list">
        </tbody>
    </table>
</fieldset>

<!-- 編集 -->
<div id="edit-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <h3>アイテムの編集</h3>
        <form id="edit-form">
            <input type="hidden" id="edit-id">
            <p>
                <label>名前: <input type="text" id="edit-name" required></label>
            </p>
            <p>
                <label>価格: <input type="number" id="edit-price"></label>
            </p>
            <p>
                <label>URL: <input type="text" id="edit-url"></label>
            </p>
            <p>
                <label>メモ: <input type="text" id="edit-memo"></label>
            </p>
            <button type="submit">保存</button>
            <button type="button" onclick="closeEditModal()">キャンセル</button>
        </form>
    </div>
</div>

<script>
    const API_URL = '/api/notes';

    window.onload = () => {
        fetchItems();
    };

    // 全件取得
    async function fetchItems() {
        try {
            const response = await fetch(API_URL);
            const items = await response.json();
            const tbody = document.getElementById('item-list');
            tbody.innerHTML = '';

            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${item.price || ''}</td>
                        <td><a href="${item.url || '#'}" target="_blank">${item.url || ''}</a></td>
                        <td>${item.memo || ''}</td>
                        <td>
                            <button onclick="openEditModal(${item.id}, '${item.name}', ${item.price || 0}, '${item.url || ''}', '${item.memo || ''}')">編集</button>
                            <button onclick="deleteItem(${item.id})">削除</button>
                        </td>
                    `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('取得エラー:', error);
        }
    }

    // 登録
    document.getElementById('add-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newItem = {
            name: document.getElementById('name').value,
            price: document.getElementById('price').value ? Number(document.getElementById('price').value) : null,
            url: document.getElementById('url').value,
            memo: document.getElementById('memo').value
        };

        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newItem)
        });

        document.getElementById('add-form').reset();
        fetchItems();
    });

    // ポップアップ
    function openEditModal(id, name, price, url, memo) {
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-name').value = name;
        document.getElementById('edit-price').value = price || '';
        document.getElementById('edit-url').value = url === 'null' ? '' : url;
        document.getElementById('edit-memo').value = memo === 'null' ? '' : memo;
        document.getElementById('edit-modal').style.display = 'block';
    }

    function closeEditModal() {
        document.getElementById('edit-modal').style.display = 'none';
    }

    // 更新
    document.getElementById('edit-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('edit-id').value;
        const updatedItem = {
            name: document.getElementById('edit-name').value,
            price: document.getElementById('edit-price').value ? Number(document.getElementById('edit-price').value) : null,
            url: document.getElementById('edit-url').value,
            memo: document.getElementById('memo').value
        };

        await fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedItem)
        });

        closeEditModal();
        fetchItems();
    });

    // 削除
    async function deleteItem(id) {
        if (!confirm('削除しますか？')) return;
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        fetchItems();
    }
</script>
</body>
</html>
