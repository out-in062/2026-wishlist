<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>欲しいものリスト</title>
</head>
<body>
<h1>欲しいものリスト</h1>

<!-- 登録フォーム -->
<section>
    <h2>新しいアイテムを追加</h2>
    <form id="add-form">
        <div>
            <label>名前: <input type="text" id="name" required></label>
        </div>
        <div>
            <label>価格: <input type="number" id="price"></label>
        </div>
        <div>
            <label>URL: <input type="text" id="url"></label>
        </div>
        <div>
            <label>メモ: <input type="text" id="memo"></label>
        </div>
        <button type="submit">登録する</button>
    </form>
</section>

<hr>

<!-- 一覧表示 -->
<section>
    <h2>欲しいもの一覧</h2>
    <button onclick="fetchItems()">リストを更新</button>
    <table border="1">
        <thead>
        <tr>
            <th>ID</th>
            <th>名前</th>
            <th>価格</th>
            <th>URL</th>
            <th>メモ</th>
        </tr>
        </thead>
        <tbody id="item-list">
        </tbody>
    </table>
</section>

<script>
    const API_URL = '/api/notes';

    window.onload = () => {
        fetchItems();
    };

    // 1. 全件取得
    async function fetchItems() {
        try {
            const response = await fetch(API_URL);
            const items = await response.json();
            const tbody = document.getElementById('item-list');
            tbody.innerHTML = '';

            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${item.price || ''}</td>
                        <td><a href="${item.url || '#'}" target="_blank">${item.url || ''}</a></td>
                        <td>${item.memo || ''}</td>
                    `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('取得エラー:', error);
        }
    }

    // 2. 登録
    document.getElementById('add-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newItem = {
            name: document.getElementById('name').value,
            price: document.getElementById('price').value ? Number(document.getElementById('price').value) : null,
            url: document.getElementById('url').value,
            memo: document.getElementById('memo').value
        };

        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newItem)
        });

        document.getElementById('add-form').reset();
        fetchItems();
    });
</script>
</body>
</html>
